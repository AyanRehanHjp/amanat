spring.application.name=amanat
spring.datasource.url=jdbc:mysql://localhost:3306/awt_db
spring.datasource.username=root
spring.datasource.password=test
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.devtools.restart.enabled=true

server.port=9000
#JWT
jwt.algorithm.key=amanat@algorithmKey
jwt.issuer=amanat@issuer
jwt.expiryTime=86400000
# ye line add karne se table ke name me underscore nahi aayega, jaise user_details ki jagah userdetails ban jayega
#spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
