<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Beneficiary Registration</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/beneficiary.css">
</head>

<body>
<div id="common-navbar"></div>
<div class="hero">
    <h1>Help Request Form</h1>
</div>

<div class="form-container">

    <form id="beneficiaryForm">

        <div class="section">
            <h3>Basic Information</h3>

            <label>Needy Name <span style="color:red">*</span></label>
            <input type="text" id="needyName" placeholder="Enter Needy Name (with C/o if applicable)" maxlength="24" required>

            <label>Mobile Number <span style="color:red">*</span></label>
            <input type="tel"
                   id="mobile"
                   placeholder="Enter Needy or Guardian Mobile Number"
                   maxlength="10"
                   pattern="[0-9]{10}"
                   oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                   required>

            <label>Full Address <span style="color:red">*</span></label>
            <textarea id="address" placeholder="Enter Complete Address of the Needy" maxlength="60" required></textarea>

            <label>Pin Code <span style="color:red">*</span></label>
            <input type="text"
                   id="pinCode"
                   placeholder="Enter Pin Code"
                   maxlength="6"
                   pattern="[0-9]{6}"
                   oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                   required>

            <label>State <span style="color:red">*</span></label>
            <select id="state" required>

                <option value="">Select State</option>

                <option>Andhra Pradesh</option>
                <option>Arunachal Pradesh</option>
                <option>Assam</option>
                <option>Bihar</option>
                <option>Chhattisgarh</option>
                <option>Goa</option>
                <option>Gujarat</option>
                <option>Haryana</option>
                <option>Himachal Pradesh</option>
                <option>Jharkhand</option>
                <option>Karnataka</option>
                <option>Kerala</option>
                <option>Madhya Pradesh</option>
                <option>Maharashtra</option>
                <option>Manipur</option>
                <option>Meghalaya</option>
                <option>Mizoram</option>
                <option>Nagaland</option>
                <option>Odisha</option>
                <option>Punjab</option>
                <option>Rajasthan</option>
                <option>Sikkim</option>
                <option>Tamil Nadu</option>
                <option>Telangana</option>
                <option>Tripura</option>
                <option>Uttar Pradesh</option>
                <option>Uttarakhand</option>
                <option>West Bengal</option>

                <option>Andaman and Nicobar Islands</option>
                <option>Chandigarh</option>
                <option>Dadra and Nagar Haveli and Daman and Diu</option>
                <option>Delhi</option>
                <option>Jammu and Kashmir</option>
                <option>Ladakh</option>
                <option>Lakshadweep</option>
                <option>Puducherry</option>

            </select>
        </div>

        <div class="section">
            <h3>Additional Details</h3>

            <label>Problem <span style="color:red">*</span></label>
            <textarea id="problem" placeholder="Describe the Current Problem in Detail" required></textarea>

            <label>Family Occupation <span style="color:red">*</span></label>
            <input type="text" id="familyOccupation" placeholder="Enter Occupation of Main Earning Member of the family" required>

            <label>Financial Condition <span style="color:red">*</span></label>
            <input type="text" id="financialCondition" placeholder="Describe Family Financial Condition"  required>

            <label>Reference Person / How do you reach <span style="color:red">*</span></label>
            <input type="text" id="comment" placeholder="Enter Reference Person or How You Reached Us" required>

            <label>Supportive Documents</label>
            <input type="file" id="supportiveDocuments" accept=".jpg,.jpeg,.png">
            <small style="color:red;">PDF is not allowed. Only JPG, JPEG, PNG are allowed.</small>

        </div>

        <button type="submit">Submit Request</button>

        <div id="msg" style="color:red;text-align:center;margin-top:10px;"></div>

    </form>
    <button class="back-btn" onclick="window.location.href='/index.html'">
        ⬅ Back to Home
    </button>
</div>


<script src="/js/constants.js"></script>
<script src="/js/api-config.js"></script>
<script src="/js/common.js"></script>
<script src="/js/beneficiary.js"></script>

<script>
    fetch('/common.html')
    .then(res => res.text())
    .then(data => {
        document.getElementById("common-navbar").innerHTML = data;
    });
</script>
</body>
</html>
