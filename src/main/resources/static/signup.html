<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Signup - Amanat Welfare Trust</title>

    <link rel="stylesheet" href="/css/signup.css">
    <link rel="stylesheet" href="/css/common.css">
</head>

<body>

<div id="common-navbar"></div>

<div class="header">
    <img src="/images/logo.png" class="logo">
</div>

<div class="card">

    <h2>Amanat Welfare Trust</h2>
    <h2>Create Account</h2>

    <div id="msgBox" class="msg">
        ⚠ <span id="msgText"></span>
    </div>

    <div class="form-grid">

        <div>
            <input id="firstName" placeholder="First Name">
            <div id="firstNameError" class="error"></div>
        </div>

        <div>
            <input id="lastName" placeholder="Last Name">
            <div id="lastNameError" class="error"></div>
        </div>

        <div>
            <input id="mobile" placeholder="Mobile">
            <div id="mobileError" class="error"></div>
        </div>

        <div>
            <input id="email" placeholder="Email">
            <div id="emailError" class="error"></div>
        </div>

        <div class="full">
            <input id="userName" placeholder="Username">
            <div id="userNameError" class="error"></div>
        </div>

        <div class="password-box">
            <input id="password" type="password" placeholder="Password">
            <span class="eye" onclick="togglePassword()">👁</span>
            <div id="passwordError" class="error"></div>
        </div>

        <div>
            <input id="confirmPassword" type="password" placeholder="Confirm Password">
            <div id="confirmPasswordError" class="error"></div>
        </div>

<!--        <div class="full">-->
<!--            <select id="role">-->
<!--                <option value="user">Member</option>-->
<!--                <option value="admin">Admin</option>-->
<!--            </select>-->
<!--        </div>-->

    </div>

    <!-- BUTTONS -->
    <div class="btn-group">

        <button class="crt-act" onclick="signup()">
            Create Account
        </button>

        <div class="btn-row">
            <button onclick="location.href='/index.html'" class="back">
                Back to Home
            </button>

            <button onclick="location.href='/login.html'" class="login">
                Go to Login
            </button>
        </div>

    </div>

</div>

<div id="popup"></div>
<script src="/js/constants.js"></script>
<script src="/js/signup.js"></script>
<script src="/js/common.js"></script>

<script>
    fetch('/common.html')
    .then(res => res.text())
    .then(data => {
        document.getElementById("common-navbar").innerHTML = data;
    });
</script>

</body>
</html>
