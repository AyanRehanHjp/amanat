<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Signup - Amanat Welfare Trust</title>

    <link rel="stylesheet" href="/css/signup.css">
    <link rel="stylesheet" href="/css/common.css">
</head>

<body>

<div id="common-navbar"></div>

<div class="header">
    <img src="/images/logo.png" class="logo">
</div>

<div class="card">

    <h2>Amanat Welfare Trust</h2>
    <h2>Create Account</h2>

    <div id="msgBox" class="msg">
        ⚠ <span id="msgText"></span>
    </div>

    <div class="form-grid">

        <!-- FIRST NAME -->
        <div>

            <label for="firstName">First Name</label>

            <input
                    id="firstName"
                    placeholder="Enter First Name"
                    minlength="3"
                    maxlength="24"
                    oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')">

            <div id="firstNameError" class="error"></div>

        </div>

        <!-- LAST NAME -->
        <div>

            <label for="lastName">Last Name</label>

            <input
                    id="lastName"
                    placeholder="Enter Last Name"
                    minlength="3"
                    maxlength="24"
                    oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')">

            <div id="lastNameError" class="error"></div>

        </div>

        <!-- MOBILE -->
        <div>

            <label for="mobile">Mobile Number</label>

            <div style="display:flex; gap:8px;">

                <select id="countryCode" style="width:170px;">

                    <option value="+91">🇮🇳 India (+91)</option>
                    <option value="+1">🇺🇸 America (+1)</option>
                    <option value="+92">🇵🇰 Pakistan (+92)</option>
                    <option value="+971">🇦🇪 Dubai UAE (+971)</option>
                    <option value="+974">🇶🇦 Qatar (+974)</option>
                    <option value="+966">🇸🇦 Saudi Arabia (+966)</option>
                    <option value="+880">🇧🇩 Bangladesh (+880)</option>
                    <option value="+94">🇱🇰 Sri Lanka (+94)</option>
                    <option value="+968">🇴🇲 Oman (+968)</option>
                    <option value="+965">🇰🇼 Kuwait (+965)</option>
                    <option value="+973">🇧🇭 Bahrain (+973)</option>
                    <option value="+98">🇮🇷 Iran (+98)</option>
                    <option value="+964">🇮🇶 Iraq (+964)</option>
                    <option value="+90">🇹🇷 Turkey (+90)</option>
                    <option value="+60">🇲🇾 Malaysia (+60)</option>
                    <option value="+62">🇮🇩 Indonesia (+62)</option>
                    <option value="+93">🇦🇫 Afghanistan (+93)</option>
                    <option value="+960">🇲🇻 Maldives (+960)</option>
                    <option value="+962">🇯🇴 Jordan (+962)</option>
                    <option value="+20">🇪🇬 Egypt (+20)</option>

                </select>

                <input
                        id="mobile"
                        placeholder="Enter Mobile Number"
                        maxlength="10"
                        oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                >

            </div>

            <div id="mobileError" class="error"></div>

        </div>

        <!-- EMAIL -->
        <div>

            <label for="email">Email Address</label>

            <input
                    id="email"
                    placeholder="Enter Email Address">

            <div id="emailError" class="error"></div>

        </div>

        <!-- USERNAME -->
        <div class="full">

            <label for="userName">Username</label>

            <input
                    id="userName"
                    placeholder="Enter Username"
                    minlength="6"
                    maxlength="24"
                    oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'')">

            <div id="userNameError" class="error"></div>

        </div>

        <!-- PASSWORD -->
        <div class="password-box">

            <label for="password">Password</label>

            <input
                    id="password"
                    type="password"
                    placeholder="Enter Password"
                    minlength="8"
                    maxlength="24">

            <span class="eye" onclick="togglePassword()">👁</span>

            <div id="passwordError" class="error"></div>

        </div>

        <!-- CONFIRM PASSWORD -->
        <div>

            <label for="confirmPassword">Confirm Password</label>

            <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm Password"
                    minlength="8"
                    maxlength="24">

            <div id="confirmPasswordError" class="error"></div>

        </div>

        <!--        <div class="full">-->
        <!--            <label for="role">Role</label>-->
        <!--            <select id="role">-->
        <!--                <option value="user">Member</option>-->
        <!--                <option value="admin">Admin</option>-->
        <!--            </select>-->
        <!--        </div>-->

    </div>

    <!-- BUTTONS -->
    <div class="btn-group">

        <button class="crt-act" onclick="signup()">
            Create Account
        </button>

        <div class="btn-row">

            <button onclick="location.href='/index.html'" class="back">
                Back to Home
            </button>

            <button onclick="location.href='/login.html'" class="login">
                Go to Login
            </button>

        </div>

    </div>

</div>

<div id="popup"></div>

<script src="/js/constants.js"></script>
<script src="/js/signup.js"></script>
<script src="/js/common.js"></script>

<script>
    fetch('/common.html')
    .then(res => res.text())
    .then(data => {
        document.getElementById("common-navbar").innerHTML = data;
    });
</script>

</body>
</html>
