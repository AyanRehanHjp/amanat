<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Details</title>

    <link rel="stylesheet" href="/css/admin-detail.css">
    <link rel="stylesheet" href="/css/common.css">
</head>

<body>
<script>
    let token = localStorage.getItem("token");
    let role = localStorage.getItem("role");

    if(!token || role !== "ADMIN"){
        alert("Access Denied - Admin Only");
        window.location.href = "/admin-login.html";
    }
</script>
<div id="common-navbar"></div>

<div class="container">

    <!-- TITLE + VIEW -->
    <div class="title-bar">
        <h2>Admin Details</h2>

        <div class="view-section">
            <span>Click here for Admin Details</span>
            <button class="view-btn" onclick="loadAdmins()">View Admins</button>
        </div>

        <div class="view-section">
            <span>Click here for Super-Admin Login</span>
            <button class="view-btn" onclick="supAdmLogin()">Super-Admin Login</button>
        </div>
    </div>

    <!-- CARD -->
    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Sl No</th>
                <th>User ID</th>
                <th>Full Name</th>
                <th>Designation</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody id="adminTableBody">
            <tr>
                <td colspan="4" class="empty">Click "View Admins" to load data</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- BACK BUTTON -->
    <div class="back-container">
        <button class="back-btn" onclick="goBack()">⬅ Back to Admin Page</button>
    </div>

</div>
<script src="/js/constants.js"></script>
<script src="/js/api-config.js"></script>
<script src="/js/admin-detail.js"></script>
<script src="/js/common.js"></script>

<script>
    fetch('/common.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById("common-navbar").innerHTML = data;
        });
</script>
<!-- RESIGN POPUP -->
<div id="resignPopup" class="popup-overlay">

    <div class="popup-box">

        <h3>Are You Sure to Resign?</h3>

        <div style="margin-top:20px;">

            <button onclick="confirmResign()"
                    style="background:red;margin-right:10px;">
                Yes
            </button>

            <button onclick="closeResignPopup()"
                    style="background:gray;">
                No
            </button>

        </div>

    </div>

</div>
</body>
</html>
