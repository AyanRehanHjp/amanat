<!DOCTYPE html>
<html>
<head>
    <title>Show Income</title>
    <link rel="stylesheet" href="css/showIncomeDet.css">

    <style>
        .back-btn {
            margin: 10px;
            padding: 8px 15px;
            background: #2e7d32;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        thead {
            background: #1b5e20;
            color: white;
        }
    </style>

</head>

<body>

<button class="back-btn" onclick="goHome()">Back to Home</button>

<div class="ShowIncomeDet">

    <!-- 🔥 NEW MONTHLY REPORT -->
    <h2>Monthly Report</h2>

    <label>Select Year:</label>
    <select id="reportYear"></select>

    <button onclick="loadReport()">Load Report</button>

    <table id="reportTable">
        <thead>
        <tr>
            <th>Member ID</th>
            <th>Jan</th>
            <th>Feb</th>
            <th>Mar</th>
            <th>Apr</th>
            <th>May</th>
            <th>Jun</th>
            <th>Jul</th>
            <th>Aug</th>
            <th>Sep</th>
            <th>Oct</th>
            <th>Nov</th>
            <th>Dec</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

    <hr>

    <!-- 🔥 OLD DATA TABLE -->
    <h2>Income Details</h2>

    <button onclick="loadIncome()">Load Data</button>

    <table id="incomeTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Member ID</th>
            <th>Amount</th>
            <th>Month</th>
            <th>Year</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<script src="js/showIncomeDet.js"></script>

</body>
</html>
