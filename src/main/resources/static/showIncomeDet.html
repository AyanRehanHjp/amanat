<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Monthly Report</title>

    <!-- CSS FILES -->
    <link rel="stylesheet" href="css/showIncomeDet.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin.css">


</head>

<body>

<!-- COMMON NAVBAR -->
<div id="common-navbar"></div>

<div class="ShowIncomeDet">

    <!-- TITLE -->
    <h2>Monthly Report</h2>
    <div class="info-text">
        📊 Select a year and click <b>Load Report</b> to view the monthly report.
    </div>
    <!-- FILTER -->
    <label>Select Year:</label>
    <select id="reportYear"></select>

    <button onclick="loadReport()">Load Report</button>

    <!-- TABLE -->
    <table id="reportTable">
        <thead>
        <tr>
            <th>Member ID</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Address</th>
            <th>Jan</th>
            <th>Feb</th>
            <th>Mar</th>
            <th>Apr</th>
            <th>May</th>
            <th>Jun</th>
            <th>Jul</th>
            <th>Aug</th>
            <th>Sep</th>
            <th>Oct</th>
            <th>Nov</th>
            <th>Dec</th>
        </tr>
        </thead>
        <tbody>
        <!-- Dynamic Data -->
        </tbody>
    </table>
    <div id="monthFilter" style="margin:15px 0;">
        <b>Select months to include months in the report and print:</b><br>

        <label><input type="checkbox" value="4"> Jan</label>
        <label><input type="checkbox" value="5"> Feb</label>
        <label><input type="checkbox" value="6"> Mar</label>
        <label><input type="checkbox" value="7"> Apr</label>
        <label><input type="checkbox" value="8"> May</label>
        <label><input type="checkbox" value="9"> Jun</label>
        <label><input type="checkbox" value="10"> Jul</label>
        <label><input type="checkbox" value="11"> Aug</label>
        <label><input type="checkbox" value="12"> Sep</label>
        <label><input type="checkbox" value="13"> Oct</label>
        <label><input type="checkbox" value="14"> Nov</label>
        <label><input type="checkbox" value="15"> Dec</label>
    </div>
    <!-- 🔥 BOTTOM BUTTONS -->
    <div style="display:flex; justify-content:space-between; margin-top:20px;">
        <button onclick="goHome()"
                style="background:#e53935; color:white; padding:8px 15px; border:none; border-radius:5px;">
            Back to Admin
        </button>

        <button onclick="printPDF()" style="padding:8px 15px; border:none; border-radius:5px;">
            Download PDF
        </button>
    </div>

</div>

<!-- JS FILE -->
<script src="js/showIncomeDet.js"></script>

<!-- COMMON JS -->
<script src="/js/common.js"></script>

<!-- LOAD COMMON NAVBAR -->
<script>
    fetch('/common.html')
       .then(res => res.text())
       .then(data => {
           document.getElementById("common-navbar").innerHTML = data;
       });
</script>

</body>
</html>
