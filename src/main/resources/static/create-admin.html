<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin - Amanat Trust</title>

    <link rel="stylesheet" href="/css/create-admin.css">
    <link rel="stylesheet" href="/css/common.css">
</head>

<body>

<script>

    let token = localStorage.getItem("token");
    let role = localStorage.getItem("role");

    if(!token || role !== "SUPER_ADMIN"){

        alert("Access Denied - Super Admin Only");

        window.location.href =
        "/super-admin-login.html";
    }

</script>

<div id="common-navbar"></div>

<div class="header">
    <h2>ADMIN SIGNUP</h2>
</div>

<div class="card">

    <h3>Create New Admin</h3>

    <div id="msgBox" class="msg">
        <span id="msgText"></span>
    </div>

    <form id="adminForm" novalidate>

        <!-- FULL NAME -->
        <label>Full Name</label>

        <input
                id="fullName"
                placeholder="Enter full name"
                required
                minlength="3"
                maxlength="24"
                oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')">

        <!-- DESIGNATION -->
        <label>Designation</label>

        <input
                id="designation"
                placeholder="Enter designation"
                required
                minlength="3"
                maxlength="16"
                oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')">

        <!-- ADMIN ID -->
        <label>Admin ID</label>

        <input
                id="userId"
                placeholder="Enter Admin ID (ADM001)"
                required
                minlength="6"
                maxlength="6"
                oninput="this.value=this.value.replace(/[^A-Za-z0-9]/g,'').replace(/^([A-Za-z]{0,3})(.*)$/,(m,p1,p2)=>p1+p2.replace(/[^0-9]/g,''))">

        <!-- PASSWORD -->
        <label>Password</label>

        <input
                id="password"
                type="password"
                placeholder="Enter Password"
                required
                minlength="8"
                maxlength="24">

        <!-- BUTTON -->
        <button type="submit" class="login-btn">
            Create Admin
        </button>

    </form>

</div>

<!-- POPUP -->
<div id="popup" class="popup">

    <div class="popup-content">

        <span class="close-btn" onclick="closePopup()">✖</span>

        <h2 id="popupTitle"></h2>

        <h3 id="popupSubTitle"></h3>

        <p id="popupMsg"></p>

    </div>

</div>

<!-- BACK BUTTON -->
<button class="signup"
        style="display:block; margin:20px auto;"
        onclick="location.href='/super-admin.html'">

    Back to Super Admin

</button>

<script src="/js/constants.js"></script>
<script src="/js/create-admin.js"></script>
<script src="/js/common.js"></script>

<script>

    fetch('/common.html')
    .then(res => res.text())
    .then(data => {

        document.getElementById("common-navbar").innerHTML = data;

    });

</script>

</body>
</html>
