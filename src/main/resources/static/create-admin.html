<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin - Amanat Trust</title>

    <link rel="stylesheet" href="/css/create-admin.css">
    <link rel="stylesheet" href="/css/common.css">
</head>

<body>

<div id="common-navbar"></div>

<div class="header">
    <h2>Admin Panel</h2>
</div>

<div class="card">

    <h3>Create New Admin</h3>

    <div id="msgBox" class="msg">
        <span id="msgText"></span>
    </div>
    <form id="adminForm">
    <label>Full Name</label>
    <input id="fullName" placeholder="Enter full name">

    <label>Designation</label>
    <input id="designation" placeholder="Enter designation">

    <label>Admin ID</label>
    <input id="userId" placeholder="Enter Admin ID AWTADM..."
           maxlength="6" minlength="3" required>

    <label>Password</label>
    <input id="password" type="password"
           maxlength="10" minlength="4" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{4,10}"
           title="Password must contain at least 1 uppercase, 1 lowercase and 1 number" required>

    <button type="submit">Create Admin</button>
    </form>
</div>
<div id="popup" class="popup">
    <div class="popup-content">
        <h2>🎉 Congratulations!</h2>
        <h3>New Admin Created Successfully</h3>

        <p id="popupMsg"></p>
    </div>
</div>
<script src="/js/create-admin.js"></script>
<script src="/js/common.js"></script>

<script>
    fetch('/common.html')
    .then(res => res.text())
    .then(data => {
        document.getElementById("common-navbar").innerHTML = data;
    });
</script>

</body>
</html>
