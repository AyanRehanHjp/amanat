<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Amanat Welfare Trust - Income Details Entry</title>

    <link rel="stylesheet" href="/css/incomedet.css">

</head>

<body>

<div class="header">

    <img src="/images/logo.png" class="logo">

    <div class="title">

        <h1>Amanat Welfare Trust</h1>
        <p>Serving the Needy</p>

    </div>

    <button class="back-btn" onclick="goHome()">⬅ Back Home</button>

</div>


<div class="container">

    <div class="form-box">

        <h2>Add Income Details</h2>

        <form id="paymentForm">

            <label>Member ID</label>
            <input type="text" id="memberId" required placeholder="Enter Member ID">

            <label>Amount (₹)</label>
            <input type="number" id="amount" required>


            <label>Month</label>
            <select id="month">

                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>

            </select>


            <label>Year</label>
            <select id="year"></select>


            <button type="submit" class="save-btn">

                Save Payment

            </button>

        </form>

    </div>

</div>
<div id="popup" class="popup">

    <div class="popup-content">

        <h2 id="popupMsg">Payment added successfully</h2>

        <button onclick="closePopup()">OK</button>

    </div>

</div>
<script src="/js/incomedet.js"></script>

</body>
</html>
