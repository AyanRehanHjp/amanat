<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Amanat Welfare Trust - Income Details Entry</title>

    <link rel="stylesheet" href="/css/incomedet.css">

</head>

<body>

<div class="header">

    <img src="/images/logo.png" class="logo">

    <div class="title">

        <h1>Amanat Welfare Trust</h1>
        <p>Serving the Needy</p>

    </div>

    <button class="back-btn" onclick="goHome()">⬅ Back Home</button>

</div>


<div class="container">

    <div class="form-box">

        <h2>Add Income Details</h2>

        <form id="paymentForm">

            <!-- Row 1 -->
            <div class="form-row">
                <div class="form-group">
                    <label class="required">Member ID</label>
                    <input type="text" id="memberId" list="memberList" placeholder="Search by ID / Name / Mobile" required>
                    <datalist id="memberList"></datalist>
                </div>

                <div class="form-group">
                    <label class="required">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter Full Name" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label class="required">Mobile Number</label>
                    <input type="text" id="mobile" placeholder="Enter Mobile Number" maxlength="10" required>
                </div>
            </div>

            <!-- Row 2 -->
            <div class="form-row">
                <div class="form-group">
                    <label class="required">Amount (₹)</label>
                    <input type="number" id="amount" required>
                </div>

                <div class="form-group">
                    <label class="required">Month</label>
                    <select id="month">
                        <option value="January">January</option>
                        <option value="February">February</option>
                        <option value="March">March</option>
                        <option value="April">April</option>
                        <option value="May">May</option>
                        <option value="June">June</option>
                        <option value="July">July</option>
                        <option value="August">August</option>
                        <option value="September">September</option>
                        <option value="October">October</option>
                        <option value="November">November</option>
                        <option value="December">December</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="required">Year</label>
                    <select id="year"></select>
                </div>

            </div>
            <div class="form-group">
                <label class="non-required">Comment</label>
                <input type="text" id="comment" placeholder="Enter any comment regarding to this payment" >
            </div>

            <!-- 🔹 Inline message (error / not registered) -->
            <div id="msg" style="color:red; text-align:center; margin-top:10px;"></div>

            <button type="submit" class="save-btn">Save Payment</button>

        </form>
    </div>

</div>

<!-- 🔹 Popup -->
<div id="popup" class="popup">

    <div class="popup-content">

        <h2 id="popupMsg">Payment added successfully</h2>

        <button onclick="closePopup()">OK</button>

    </div>

</div>

<script src="/js/incomedet.js"></script>

</body>
</html>
