<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Amanat Welfare Trust - Income Details Entry</title>

    <link rel="stylesheet" href="/css/incomedet.css">

</head>

<body>

<div class="header">

    <img src="/images/logo.png" class="logo">

    <div class="title">

        <h1>Amanat Welfare Trust</h1>
        <p>Serving the Needy</p>

    </div>

    <button class="back-btn" onclick="goHome()">⬅ Back Home</button>

</div>


<div class="container">

    <div class="form-box">

        <h2>Add Income Details</h2>

        <form id="paymentForm">

            <label>Member ID</label>
            <input type="text" id="memberId" required placeholder="Enter Member ID">

            <label>Amount (₹)</label>
            <input type="number" id="amount" required>


            <label>Month</label>
            <select id="month">
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September">September</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
            </select>


            <label>Year</label>
            <select id="year"></select>


            <button type="submit" class="save-btn">

                Save Payment

            </button>

        </form>

    </div>

</div>
<div id="popup" class="popup">

    <div class="popup-content">

        <h2 id="popupMsg">Payment added successfully</h2>

        <button onclick="closePopup()">OK</button>

    </div>

</div>
<script src="/js/incomedet.js"></script>

</body>
</html>
