<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>Receipt Generator</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/receipt.css">

    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        window.jsPDF = window.jspdf.jsPDF;
    </script>

</head>

<body>
<div id="common-navbar"></div>

<script>
    let token = localStorage.getItem("token");
    let role = localStorage.getItem("role");

    if(!token || role !== "ADMIN"){
        alert("Access Denied - Admin Only");
        window.location.href = "/admin-login.html";
    }
</script>
<div class="page">

    <div class="card">

        <div style="position:relative; text-align:center;">
            <img src="/images/logo.png" style="position:absolute; left:8px; top:10px; width:118px;">
            <h1>AMANAT WELFARE TRUST</h1>
        </div>
        <h2 style="text-align:center;">Receipt Generator</h2>

        <p class="desc">
            Fill the form to generate a receipt. Please keep the receipt number unique.
        </p>

        <div class="form-grid">

            <div class="field">
                <label>Receipt Number<span style="color:red">*</span></label>
                <input id="receiptNo" type="text" required pattern="[0-9]+" placeholder="Enter receipt number">
            </div>

            <div class="field">
                <label>Name<span style="color:red">*</span></label>
                <input id="name" type="text" required placeholder="Enter name">
            </div>

            <div class="field">
                <label>Address<span style="color:red">*</span></label>
                <input id="address" type="text" required placeholder="Enter address">
            </div>

            <div class="field">
                <label>Amount<span style="color:red">*</span></label>
                <input id="amount" type="number" required placeholder="Enter amount">
            </div>

            <div class="field">
                <label>Receipt Date<span style="color:red">*</span></label>
                <input id="date" type="date" required>
            </div>

        </div>

        <div class="buttons">

            <button class="generate" onclick="generateReceipt()">
                Generate Receipt
            </button>

            <button class="admin" onclick="window.location.href='/expenditure.html'">
                Back to Expenditure
            </button>

        </div>
        <p class="desc">
            ⚠️ Important Notice:
            After downloading the receipt, you must enter the same details in the EXPENDITURE DETAILS.
            This step is mandatory. </p>
    </div>

</div>

<!-- ===== RECEIPT MODAL ===== -->

<div id="receiptModal" class="modal" style="display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;">

    <div class="modal-content" style="background:#fff;padding:20px;position:relative;">

        <div id="receiptArea" style="position:relative;width:700px;margin:auto;">

            <img src="/images/receipt.png" style="width:100%;display:block;" crossorigin="anonymous">

            <div id="pName" style="position:absolute;top:170px;left:156px;font-weight:bold;"></div>
            <div id="pAddress" style="position:absolute;top:215px;left:157px;"></div>
            <div id="pDate" style="position:absolute;top:311px;right:456px;"></div>
            <div id="pRec" style="position:absolute;top:130px;right:60px;"></div>
            <div id="pAmount" style="position:absolute;top:393px;left:550px;font-weight:bold; font-size:19px"></div>
            <div id="pAmountWords" style="position:absolute;top:261px;left:210px;"></div>
            <img src="/images/sign.png" style="position:absolute; bottom:104px; left:120px; width:81px;">
        </div>

        <div style="text-align:center;margin-top:20px;">
            <button class="download" onclick="download()">Download PDF</button>
            <button class="download" onclick="window.location.href='/recpdfgen.html'"> Return without Download </button>
        </div>

    </div>

</div>
<script src="/js/common.js"></script>
<script src="/js/receipt.js" ></script>
<script>
    fetch('/common.html')
    .then(res => res.text())
    .then(data => {
        document.getElementById("common-navbar").innerHTML = data;
    });
</script>
</body>
</html>
