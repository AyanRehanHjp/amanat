<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Members - Amanat Welfare Trust</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/members.css">
</head>

<body>
<div id="common-navbar"></div>

<script>
    let token = localStorage.getItem("token");
    let role = localStorage.getItem("role");

    if(!token || role !== "ADMIN"){
        alert("Access Denied - Admin Only");
        window.location.href = "/admin-login.html";
    }
</script>
<header>
    All Members Associated With Amanat Welfare Trust
</header>

<div class="container">
    <h2 id="formTitle">Add New Member</h2>

    <div class="add-member-box">
        <div class="form-group">
            <label>Member ID</label>
            <input type="text" id="memberId" placeholder="Auto-Generated Member ID" disabled>
        </div>
        <div class="form-group small">
            <label>Prefix</label>
            <select id="prefix">
                <option value="">Select</option>
                <option value="MD">MD</option>
                <option value="MR">MR</option>
                <option value="MRS">MRS</option>
            </select>
        </div>

        <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstname" oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')">
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastname" oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')">
        </div>

        <div class="form-group small">
            <label>Year</label>
            <select id="joiningYear"></select>
        </div>

        <div class="form-group mobile-group">
            <label>Mobile</label>
            <div class="mobile-box">
                <select id="countryCode">
                    <option value="+91">+91</option>
                </select>
                <input type="tel" id="mobile" maxlength="10" placeholder="Enter Mobile Number"
                       oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text" id="address">
        </div>

        <div class="form-group small">
            <label>Status</label>
            <select id="status">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
                <option value="LEFT">LEFT</option>
            </select>
        </div>

        <div class="form-group">
            <label>Joined By</label>
            <input type="text" id="joinedBy" oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')">
        </div>
        <div class="form-group small">

            <label>Registration Flag</label>

            <select id="approvalFlag">

                <option value="P">PENDING</option>
                <option value="A">APPROVED</option>
                <option value="R">REJECTED</option>

            </select>

        </div>
        <div class="form-group button-group">
            <button type="button" onclick="saveMember()">Save</button>
        </div>

    </div>

    <h2 class="title">SEARCH BY NAME or NUMBER</h2>

    <div class="member-search-box">

        <div class="form-group">
            <label>Search By Name</label>
            <input type="text" id="searchName" maxlength="30" placeholder="Enter Name" oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')">

        </div>

        <div class="form-group">
            <label>Search By Mobile</label>
            <input type="tel" id="searchMobile" maxlength="10" placeholder="Enter Mobile Number"
                   oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        </div>

        <div class="form-group search-btn-group">
            <button type="button" onclick="searchMembers()">Search</button>
        </div>

        <div class="form-group all-members-btn-group">
            <button type="button" onclick="loadMembers()">All Members</button>
        </div>

        <div class="form-group reset-btn-group">
            <button type="button" onclick="resetSearch()">Reset</button>
        </div>
    </div>

    <h2 class="title">Member List</h2>

    <table id="membersTable">
        <thead>
        <tr>
            <th>SN.</th>
            <th>Member ID</th>
            <th>Prefix</th>
            <th>Full Name</th>
            <th>Joining Year</th>
            <th>Mobile</th>
            <th>Address</th>
            <th>Status</th>
            <th>Joined By</th>
            <th>Approval Flag</th>
            <th>Action/Edit</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="pagination">

        <button onclick="previousPage()">
            Previous
        </button>

        <span id="pageInfo">
        Page 1
    </span>

        <button onclick="nextPage()">
            Next
        </button>

    </div>
    <button class="back-btn" onclick="goBack()">⬅ Back to Admin</button>

</div>

<script src="/js/constants.js"></script>
<script src="/js/api-config.js"></script>
<script src="/js/common.js"></script>
<script src="/js/members.js"></script>

<script>
    fetch('/common.html')
    .then(res => res.text())
    .then(data => {
        document.getElementById("common-navbar").innerHTML = data;
    });
</script>
</body>
</html>
