<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Members - Amanat Welfare Trust</title>
    <link rel="stylesheet" href="/css/members.css">
</head>

<body>
<script>
    let token = localStorage.getItem("token");

    if(!token){
        alert("Please login first");
        window.location.href = "/admin-login.html";
    }
</script>
<header>
    All Members Associated With Amanat Welfare Trust
</header>

<div class="container">

    <button class="back-btn" onclick="goBack()">⬅ Back to Admin</button>

    <h2 id="formTitle">Add New Member</h2>

    <div class="add-member-box">
        <div class="form-group">
            <label>Member ID</label>
            <input type="text" id="memberId" placeholder="Auto / Enter Member ID">
        </div>
        <div class="form-group small">
            <label>Prefix</label>
            <select id="prefix">
                <option value="">Select</option>
                <option value="MD">Md</option>
                <option value="Mr">Mr</option>
                <option value="Mrs">Mrs</option>
            </select>
        </div>

        <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstname">
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastname">
        </div>

        <div class="form-group small">
            <label>Year</label>
            <select id="joiningYear"></select>
        </div>

        <div class="form-group mobile-group">
            <label>Mobile</label>
            <div class="mobile-box">
                <select id="countryCode">
                    <option value="+91">+91</option>
                </select>
                <input type="tel" id="mobile" maxlength="10" placeholder="Enter Mobile Number">
            </div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text" id="address">
        </div>

        <div class="form-group small">
            <label>Status</label>
            <select id="status">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
                <option value="Left">Left</option>
            </select>
        </div>

        <div class="form-group">
            <label>Joined By</label>
            <input type="text" id="joinedBy">
        </div>

        <div class="form-group button-group">
            <button type="button" onclick="saveMember()">Save</button>
        </div>

    </div>

    <h2 class="title">Member List</h2>

    <table id="membersTable">
        <thead>
        <tr>
            <th>SN.</th>
            <th>Member ID</th>
            <th>Prefix</th>
            <th>Full Name</th>
            <th>Joining Year</th>
            <th>Mobile</th>
            <th>Address</th>
            <th>Status</th>
            <th>Joined By</th>
            <th>Action/Edit</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<script src="/js/members.js"></script>

</body>
</html>
