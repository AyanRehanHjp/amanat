<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Amanat Welfare Trust - Post Holders</title>

    <link rel="stylesheet" href="/css/postholder.css">

</head>

<body>

<!-- HEADER -->
<header class="header">

    <img src="/images/logo.png" class="logo">

    <div class="title">
        <h1>AMANAT WELFARE TRUST</h1>
        <p>Post Holders Management Panel</p>
    </div>
    <a href="/admin.html" class="adminBtn">Go To Admin</a>

</header>


<div class="container">

    <!-- ADD FORM -->

    <div class="card">

        <h2>Add Post Holder</h2>

        <form id="postholderForm">

            <div class="formGroup">
                <label>Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="formGroup">
                <label>Post</label>
                <input type="text" id="post" required>
            </div>

            <div class="formGroup">
                <label>Contact Number</label>
                <input type="text" id="contactNo" required>
            </div>

            <div class="formGroup">
                <label>Address</label>
                <input type="text" id="address" required>
            </div>

            <button type="submit">Add Post Holder</button>

        </form>

    </div>


    <!-- TABLE -->

    <div class="card">

        <h2>All Post Holders</h2>

        <table id="postholderTable">

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Post</th>
                <th>Contact</th>
                <th>Address</th>
            </tr>
            </thead>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Post</th>
                <th>Contact</th>
                <th>Address</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody></tbody>

        </table>

    </div>

</div>

<script src="/js/postholder.js"></script>

</body>
</html>
