<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expenditure Details - Amanat Welfare Trust</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/expenditure.css">
</head>

<body>

<div id="common-navbar"></div>

<script>
    let token = localStorage.getItem("token");
    let role = localStorage.getItem("role");

    if(!token || role !== "ADMIN"){
        alert("Access Denied - Admin Only");
        window.location.href = "/admin-login.html";
    }
</script>

<header>
    Amanat Welfare Trust - Expenditure Records
</header>

<button class="back-btn" onclick="goBack()">⬅ Back to Admin</button>

<div class="container">

    <!-- FORM -->
    <div class="form-container">

        <h2>Add New Expenditure</h2>

        <table class="add-exp-table">

            <thead>
            <tr>
                <th>Receipt No</th>
                <th>Name</th>
                <th>Address</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Year</th>
                <th>Problem</th>
                <th>Supp Docs</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr>
                <td><input type="text" id="receiptNo" readonly ></td>
                <td><input type="text" id="name" placeholder="Name"></td>
                <td><input type="text" id="address" placeholder="Address"></td>
                <td><input type="number" id="amount" placeholder="Amount"></td>
                <td><input type="date" id="expDate"></td>
                <td><input type="number" id="year"></td>
                <td><input type="text" id="problem"></td>
                <td><input type="file" id="supDoc"></td>
                <td><button onclick="saveExp()">Save</button></td>
            </tr>
            </tbody>

        </table>

    </div>

    <!-- TABLE -->

    <h2>All Expenditure Details</h2>

    <table id="expTable">

        <thead>
        <tr>
            <th>Sl No</th>
            <th>Receipt No</th>
            <th>Name</th>
            <th>Address</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Year</th>
            <th>Problem</th>
            <th>Supp Docs</th>
            <th>Generate Receipt</th>
            <th>View Receipt</th>
        </tr>
        </thead>

        <tbody></tbody>

    </table>

</div>

<script src="/js/constants.js"></script>
<script src="/js/api-config.js"></script>
<script src="/js/common.js"></script>
<script src="/js/expenditure.js"></script>

<script>
    fetch('/common.html')
    .then(res => res.text())
    .then(data => {
        document.getElementById("common-navbar").innerHTML = data;
    });
</script>

</body>
</html>
